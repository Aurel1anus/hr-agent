[project]
name = "hr-recruiting-backend"
version = "0.1.0"
description = "HR Recruiting MVP Backend"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi[standard]>=0.115,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.14,<2.0",
    "pydantic>=2.8,<3.0",
    "pytest>=8.0,<9.0",
    "httpx>=0.27,<1.0",
    "openai>=1.50,<2.0",
    "python-dotenv>=1.0,<2.0"
]

[tool.fastapi]
entrypoint = "app.main:app"
