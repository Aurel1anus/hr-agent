services:
  backend:
    build:
      context: ./backend
    container_name: hr-recruiting-backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - path: ./backend/.env
        required: false
    volumes:
      - ./backend/data:/app/data
    environment:
      DATABASE_URL: sqlite:///./data/hr_recruiting.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    container_name: hr-recruiting-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped
